name: Update picks

on:
  schedule:
    - cron: "0 16 * * 4"   # Thursday 16:00 UTC — lines are usually posted
    - cron: "0 15 * * 6"   # Saturday 15:00 UTC — fight-day refresh
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate predictions
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python predict.py --refresh
      - name: Commit snapshot
        run: |
          git config user.name "picks-bot"
          git config user.email "actions@github.com"
          git add predictions/
          git diff --cached --quiet || git commit -m "Auto-update picks $(date -u +%F)"
          git push
